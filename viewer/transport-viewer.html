<!doctype html>
<meta charset="utf-8">
<title>sw-MLPL visualization transport viewer</title>
<style>body{font:16px system-ui;max-width:70rem;margin:2rem auto;padding:0 1rem;background:#10151c;color:#e8eef5}textarea{width:100%;height:14rem;background:#18212b;color:#d7f5dc}article{border:1px solid #526579;margin:1rem 0;padding:1rem;border-radius:.5rem}code{color:#8de5a1}</style>
<h1>Visualization JSONL inspector</h1>
<p>Optional dependency-free viewer. Paste validated JSONL from the transport demo; headless MLPL tests remain authoritative.</p>
<textarea id="input" placeholder="One visualization envelope per line"></textarea><button id="render">Inspect envelopes</button><main id="output"></main>
<script>render.onclick=()=>{output.replaceChildren();for(const line of input.value.split(/\n/).filter(Boolean)){const e=JSON.parse(line),a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=`${e.sequence}: ${e.kind} (LOD ${e.lod})`;p.textContent=`${e.provenance} — ${e.payload_bytes} payload bytes, ${e.object_count} logical objects`;a.append(h,p);output.append(a)}}</script>
